project:
  title: "The Summarizer Is the Monitor: swarm oversight is capped by whoever writes the record it reads"
  question: >
    When swarm monitors read LLM-written summaries instead of raw logs, how much of what they can catch is
    decided by the summarizer, does agent-authored testimony (corrections, blame notes) get laundered into the
    record as fact, and can a cheap audit predict a summarizer's pass-through before deployment?
  status: active
  started: "2026-11-06"
  domain: "multi-agent oversight / AI control (Track 4, cross-listed T3)"
  approved_by_jollen: "2026-11-06 22:20 PT ('go' after package F recommendation)"

