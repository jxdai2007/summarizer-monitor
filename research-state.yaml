  key_papers:
    - {id: "2607.11751", relevance: "observability boundary: local views miss compositional harm (closest general point)"}
    - {id: "2605.31593", relevance: "distributed / decomposition attacks on monitors"}
    - {id: "2506.10949", relevance: "sequential monitors for split attacks"}
