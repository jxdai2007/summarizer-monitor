evidence_so_far:   # all pre-workspace results live in ~/research-taste/swarm-alignment/pilots/2026-11-06/
  - "Planted split deals: GPT-5.6 summaries (luna cheap, sol flagship) cut detection 24-40 pts at 0 false alarms; Claude/Gemini summaries 0-10 (review2/l2_13.md)."
  - "Monitor never beats its summarizer: 6/6 families, rho 0.99 (loop2d)."
  - "Second corpus ChatDev/MAST: 41/69 -> 21/69 (loop9)."
  - "Agent-written deals (loop8): Sonnet 48/66 -> 37/66 fixed threshold (two-sided p=0.001); matched-FA loss +6 (CI -3..15) n.s."
  - "Corrections: luna clears 10/24 rule breaks after a one-line correction on realistic logs (0/24 without) (review2/agent_records.md)."
  - "Blame chain: Sonnet suspends only the innocent 16/28 via summaries vs 0/28 raw; summarizer line -> 0/28 (loop1c L1c-20/20b)."
  - "Editable summaries: deleting 1-2 summary sentences hides 14/15 caught deals; deleting any raw message 0/60 (loop2d L2d-15)."

